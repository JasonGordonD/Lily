name: Deploy to LiveKit Cloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Migration 021 uses vector(192); mirror Supabase's pgvector-enabled
        # PostgreSQL instead of failing only when production applies it.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lily_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: lily_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Apply migrations to empty PostgreSQL
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (
              select 1 from information_schema.columns
              where table_name = 'lily_questions'
                and column_name = 'canonical_answer'
                and is_nullable = 'NO'
            ) then
              raise exception 'canonical_answer schema is incomplete';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_name = 'lily_questions'
                and column_name = 'acceptable_answers'
                and data_type = 'ARRAY'
            ) then
              raise exception 'acceptable_answers is not text[]';
            end if;
            if not exists (
              select 1 from information_schema.columns
              where table_name = 'lily_questions'
                and column_name = 'mode'
            ) then
              raise exception 'mode column is missing';
            end if;
          end
          $$;
          SQL

      - name: Build production image
        run: docker build --tag lily-ci .

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy agent
        run: |
          docker run --rm \
            -e INPUT_OPERATION="deploy" \
            -e INPUT_WORKING_DIRECTORY="." \
            -e INPUT_TIMEOUT="5m" \
            -e LIVEKIT_URL="${LIVEKIT_URL}" \
            -e LIVEKIT_API_KEY="${LIVEKIT_API_KEY}" \
            -e LIVEKIT_API_SECRET="${LIVEKIT_API_SECRET}" \
            -e ELEVEN_API_KEY="${ELEVEN_API_KEY}" \
            -e LILY_VOICE_ID="${LILY_VOICE_ID}" \
            -e RAVEN_VOICE_ID="${RAVEN_VOICE_ID}" \
            -e GOOGLE_API_KEY="${GOOGLE_API_KEY}" \
            -e EXA_API_KEY="${EXA_API_KEY}" \
            -e TAVILY_API_KEY="${TAVILY_API_KEY}" \
            -e XAI_API_KEY="${XAI_API_KEY}" \
            -e SPEECHMATICS_API_KEY="${SPEECHMATICS_API_KEY}" \
            -e SUPABASE_URL="${SUPABASE_URL}" \
            -e SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY}" \
            -e LILY_VOCAL_MODEL="${LILY_VOCAL_MODEL}" \
            -e LILY_REASONING_MODEL="${LILY_REASONING_MODEL}" \
            -e LILY_MAX_OUTPUT_TOKENS="${LILY_MAX_OUTPUT_TOKENS}" \
            -e LILY_REASONING_MAX_OUTPUT_TOKENS="${LILY_REASONING_MAX_OUTPUT_TOKENS}" \
            -e LILY_JUDGE_MAX_OUTPUT_TOKENS="${LILY_JUDGE_MAX_OUTPUT_TOKENS}" \
            -e LILY_ANSWER_WINDOW_SECONDS="${LILY_ANSWER_WINDOW_SECONDS}" \
            -e LILY_STEAL_WINDOW_SECONDS="${LILY_STEAL_WINDOW_SECONDS}" \
            -e LILY_CHECKPOINT_INTERVAL_SECONDS="${LILY_CHECKPOINT_INTERVAL_SECONDS}" \
            -e LILY_SHUTDOWN_TIMEOUT_SECONDS="${LILY_SHUTDOWN_TIMEOUT_SECONDS}" \
            -e LILY_ROUNDS="${LILY_ROUNDS}" \
            -e LILY_QUESTIONS_PER_ROUND="${LILY_QUESTIONS_PER_ROUND}" \
            -e LILY_KB_ONLY="${LILY_KB_ONLY}" \
            -e LILY_THINKING_BED_PATH="${LILY_THINKING_BED_PATH}" \
            -e LILY_STINGER_CORRECT_PATH="${LILY_STINGER_CORRECT_PATH}" \
            -e LILY_STINGER_INCORRECT_PATH="${LILY_STINGER_INCORRECT_PATH}" \
            -e LILY_JOB_MEMORY_LIMIT_MB="${LILY_JOB_MEMORY_LIMIT_MB}" \
            -e LILY_SESSION_LOG_DIR="${LILY_SESSION_LOG_DIR}" \
            -e LILY_GROUP_ID="${LILY_GROUP_ID}" \
            -e LILY_PARTICIPANT_METADATA_WAIT="${LILY_PARTICIPANT_METADATA_WAIT}" \
            -e LILY_ARCHITECT_MODE="${LILY_ARCHITECT_MODE}" \
            -e LILY_INTERRUPTION_MODE="${LILY_INTERRUPTION_MODE}" \
            -e LILY_FALSE_INTERRUPTION_TIMEOUT="${LILY_FALSE_INTERRUPTION_TIMEOUT}" \
            -e LILY_NOISE_CANCELLATION="${LILY_NOISE_CANCELLATION}" \
            -e LILY_ADULT_DECK="${LILY_ADULT_DECK}" \
            -e LILY_ADULT_VOCAL_MODEL="${LILY_ADULT_VOCAL_MODEL}" \
            -e LILY_ADULT_VOCAL_EFFORT="${LILY_ADULT_VOCAL_EFFORT}" \
            -e LILY_ADULT_VOCAL_READ_TIMEOUT="${LILY_ADULT_VOCAL_READ_TIMEOUT}" \
            -e LILY_ADULT_REASONING_MODEL="${LILY_ADULT_REASONING_MODEL}" \
            -e LILY_ADULT_REASONING_EFFORT="${LILY_ADULT_REASONING_EFFORT}" \
            -e LILY_ARSENAL_TARGET_DEPTH="${LILY_ARSENAL_TARGET_DEPTH}" \
            -e LILY_ARSENAL_REPLENISH_RATIO="${LILY_ARSENAL_REPLENISH_RATIO}" \
            -e LILY_ARSENAL_GATE_MODE="${LILY_ARSENAL_GATE_MODE}" \
            -e LILY_ARSENAL_IMAGE_COST_USD="${LILY_ARSENAL_IMAGE_COST_USD}" \
            -e LILY_ARSENAL_MODERATION_RETRIES="${LILY_ARSENAL_MODERATION_RETRIES}" \
            -e LILY_ARSENAL_REAL_IMAGES="${LILY_ARSENAL_REAL_IMAGES}" \
            -e LILY_ROOM_DISCHARGE_SECONDS="${LILY_ROOM_DISCHARGE_SECONDS}" \
            -e AUDEERING_API_KEY="${AUDEERING_API_KEY}" \
            -e AUDEERING_MAX_UPLOADS_PER_SESSION="${AUDEERING_MAX_UPLOADS_PER_SESSION}" \
            -e AUDEERING_WINDOW_SECONDS_F="${AUDEERING_WINDOW_SECONDS_F}" \
            -e AUDEERING_CAPTURE_INTERVAL_SECONDS="${AUDEERING_CAPTURE_INTERVAL_SECONDS}" \
            -e AUDEERING_MIN_SNR_DB="${AUDEERING_MIN_SNR_DB}" \
            -e AUDEERING_SNR_TRANSIT_ADJUST="${AUDEERING_SNR_TRANSIT_ADJUST}" \
            -e AUDEERING_AVD_SMOOTH_WINDOW="${AUDEERING_AVD_SMOOTH_WINDOW}" \
            -e AUDEERING_AVD_NEUTRAL_BAND="${AUDEERING_AVD_NEUTRAL_BAND}" \
            -e AUDEERING_CHILD_HALT_THRESHOLD_HIGH="${AUDEERING_CHILD_HALT_THRESHOLD_HIGH}" \
            -e AUDEERING_CHILD_HALT_THRESHOLD_BORDERLINE="${AUDEERING_CHILD_HALT_THRESHOLD_BORDERLINE}" \
            -e AUDEERING_CHILD_HALT_SUSTAINED_N="${AUDEERING_CHILD_HALT_SUSTAINED_N}" \
            -e AUDEERING_CHILD_HALT_ENABLED="${AUDEERING_CHILD_HALT_ENABLED}" \
            -e AUDEERING_CHILD_STEP_UP_ENABLED="${AUDEERING_CHILD_STEP_UP_ENABLED}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -v "${{ github.workspace }}:/workspace" \
            -w "/workspace" \
            docker.io/livekit/cloud-agents-github-plugin:v2.12.1
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          LILY_VOICE_ID: ${{ secrets.LILY_VOICE_ID }}
          RAVEN_VOICE_ID: ${{ secrets.RAVEN_VOICE_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Grok vision (lily_vision, Zuna port) — same fleet secret Zuna's
          # deploy forwards; missing = vision honestly unavailable.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SPEECHMATICS_API_KEY: ${{ secrets.SPEECHMATICS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LILY_VOCAL_MODEL: ${{ vars.LILY_VOCAL_MODEL }}
          LILY_REASONING_MODEL: ${{ vars.LILY_REASONING_MODEL }}
          LILY_MAX_OUTPUT_TOKENS: ${{ vars.LILY_MAX_OUTPUT_TOKENS }}
          LILY_REASONING_MAX_OUTPUT_TOKENS: ${{ vars.LILY_REASONING_MAX_OUTPUT_TOKENS }}
          LILY_JUDGE_MAX_OUTPUT_TOKENS: ${{ vars.LILY_JUDGE_MAX_OUTPUT_TOKENS }}
          LILY_ANSWER_WINDOW_SECONDS: ${{ vars.LILY_ANSWER_WINDOW_SECONDS }}
          LILY_STEAL_WINDOW_SECONDS: ${{ vars.LILY_STEAL_WINDOW_SECONDS }}
          LILY_CHECKPOINT_INTERVAL_SECONDS: ${{ vars.LILY_CHECKPOINT_INTERVAL_SECONDS }}
          LILY_SHUTDOWN_TIMEOUT_SECONDS: ${{ vars.LILY_SHUTDOWN_TIMEOUT_SECONDS }}
          LILY_ROUNDS: ${{ vars.LILY_ROUNDS }}
          LILY_QUESTIONS_PER_ROUND: ${{ vars.LILY_QUESTIONS_PER_ROUND }}
          LILY_KB_ONLY: ${{ vars.LILY_KB_ONLY }}
          LILY_THINKING_BED_PATH: ${{ vars.LILY_THINKING_BED_PATH }}
          LILY_STINGER_CORRECT_PATH: ${{ vars.LILY_STINGER_CORRECT_PATH }}
          LILY_STINGER_INCORRECT_PATH: ${{ vars.LILY_STINGER_INCORRECT_PATH }}
          LILY_JOB_MEMORY_LIMIT_MB: ${{ vars.LILY_JOB_MEMORY_LIMIT_MB }}
          LILY_SESSION_LOG_DIR: ${{ vars.LILY_SESSION_LOG_DIR }}
          LILY_GROUP_ID: ${{ vars.LILY_GROUP_ID }}
          LILY_PARTICIPANT_METADATA_WAIT: ${{ vars.LILY_PARTICIPANT_METADATA_WAIT }}
          LILY_ARCHITECT_MODE: ${{ vars.LILY_ARCHITECT_MODE }}
          LILY_INTERRUPTION_MODE: ${{ vars.LILY_INTERRUPTION_MODE }}
          LILY_FALSE_INTERRUPTION_TIMEOUT: ${{ vars.LILY_FALSE_INTERRUPTION_TIMEOUT }}
          LILY_NOISE_CANCELLATION: ${{ vars.LILY_NOISE_CANCELLATION }}
          LILY_ADULT_DECK: ${{ vars.LILY_ADULT_DECK }}
          LILY_ADULT_VOCAL_MODEL: ${{ vars.LILY_ADULT_VOCAL_MODEL }}
          LILY_ADULT_VOCAL_EFFORT: ${{ vars.LILY_ADULT_VOCAL_EFFORT }}
          LILY_ADULT_VOCAL_READ_TIMEOUT: ${{ vars.LILY_ADULT_VOCAL_READ_TIMEOUT }}
          LILY_ADULT_REASONING_MODEL: ${{ vars.LILY_ADULT_REASONING_MODEL }}
          LILY_ADULT_REASONING_EFFORT: ${{ vars.LILY_ADULT_REASONING_EFFORT }}
          LILY_ARSENAL_TARGET_DEPTH: ${{ vars.LILY_ARSENAL_TARGET_DEPTH }}
          LILY_ARSENAL_REPLENISH_RATIO: ${{ vars.LILY_ARSENAL_REPLENISH_RATIO }}
          LILY_ARSENAL_GATE_MODE: ${{ vars.LILY_ARSENAL_GATE_MODE }}
          LILY_ARSENAL_IMAGE_COST_USD: ${{ vars.LILY_ARSENAL_IMAGE_COST_USD }}
          LILY_ARSENAL_MODERATION_RETRIES: ${{ vars.LILY_ARSENAL_MODERATION_RETRIES }}
          LILY_ARSENAL_REAL_IMAGES: ${{ vars.LILY_ARSENAL_REAL_IMAGES }}
          LILY_ROOM_DISCHARGE_SECONDS: ${{ vars.LILY_ROOM_DISCHARGE_SECONDS }}
          AUDEERING_API_KEY: ${{ secrets.AUDEERING_API_KEY }}
          AUDEERING_MAX_UPLOADS_PER_SESSION: ${{ vars.AUDEERING_MAX_UPLOADS_PER_SESSION }}
          AUDEERING_WINDOW_SECONDS_F: ${{ vars.AUDEERING_WINDOW_SECONDS_F }}
          AUDEERING_CAPTURE_INTERVAL_SECONDS: ${{ vars.AUDEERING_CAPTURE_INTERVAL_SECONDS }}
          AUDEERING_MIN_SNR_DB: ${{ vars.AUDEERING_MIN_SNR_DB }}
          AUDEERING_SNR_TRANSIT_ADJUST: ${{ vars.AUDEERING_SNR_TRANSIT_ADJUST }}
          AUDEERING_AVD_SMOOTH_WINDOW: ${{ vars.AUDEERING_AVD_SMOOTH_WINDOW }}
          AUDEERING_AVD_NEUTRAL_BAND: ${{ vars.AUDEERING_AVD_NEUTRAL_BAND }}
          AUDEERING_CHILD_HALT_THRESHOLD_HIGH: ${{ vars.AUDEERING_CHILD_HALT_THRESHOLD_HIGH }}
          AUDEERING_CHILD_HALT_THRESHOLD_BORDERLINE: ${{ vars.AUDEERING_CHILD_HALT_THRESHOLD_BORDERLINE }}
          AUDEERING_CHILD_HALT_SUSTAINED_N: ${{ vars.AUDEERING_CHILD_HALT_SUSTAINED_N }}
          AUDEERING_CHILD_HALT_ENABLED: ${{ vars.AUDEERING_CHILD_HALT_ENABLED }}
          AUDEERING_CHILD_STEP_UP_ENABLED: ${{ vars.AUDEERING_CHILD_STEP_UP_ENABLED }}
