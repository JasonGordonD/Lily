name: Sync README to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync README to Supabase
        env:
          SUPABASE_URL: https://svqbfxdhpsmioaosuhkb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ ! -f README.md ]; then
            echo "::warning::No README.md at repo root — recording failure"
            FAIL_PAYLOAD=$(jq -n \
              --arg repo "$REPO_NAME" \
              --arg sha "$COMMIT_SHA" \
              --arg err "README.md not found at repo root" \
              '{repo_name: $repo, content: "", content_hash: "", commit_sha: $sha, sync_status: "failed", sync_error: $err}')
            curl -fsS -X POST "$SUPABASE_URL/rest/v1/agent_readmes" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              -d "$FAIL_PAYLOAD"
            exit 1
          fi

          NEW_HASH=$(sha256sum README.md | awk '{print $1}')
          echo "New hash: $NEW_HASH"

          STORED=$(curl -fsS "$SUPABASE_URL/rest/v1/agent_readmes?repo_name=eq.$REPO_NAME&select=content_hash" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          STORED_HASH=$(echo "$STORED" | jq -r '.[0].content_hash // ""')
          echo "Stored hash: $STORED_HASH"

          if [ "$NEW_HASH" = "$STORED_HASH" ] && [ -n "$STORED_HASH" ]; then
            echo "Content unchanged — skipping sync."
            exit 0
          fi

          jq -n \
            --arg repo "$REPO_NAME" \
            --rawfile content README.md \
            --arg hash "$NEW_HASH" \
            --arg sha "$COMMIT_SHA" \
            '{repo_name: $repo, content: $content, content_hash: $hash, commit_sha: $sha, sync_status: "success", sync_error: null}' > /tmp/payload.json

          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/agent_readmes" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data-binary @/tmp/payload.json)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ README synced. HTTP $HTTP_CODE"
          else
            echo "✗ Sync failed. HTTP $HTTP_CODE"
            cat /tmp/resp.json
            exit 1
          fi
